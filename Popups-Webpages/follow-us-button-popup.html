
<style>
.hr-follow-popup,
.hr-follow-popup * {
  box-sizing: border-box;
}

.hr-follow-popup {
  position: relative;
  width: 550px;
  max-width: calc(100vw - 24px);
  padding: 25px 25px 24px;
  font-family: Georgia, "Times New Roman", serif;
  color: #003d20;
  text-align: center;
  background: radial-gradient(
    ellipse at center, #fffdf4, #f5e4c4
  );
  border: 7px double #a67b2c;
  border-radius: 27px;
  box-shadow:
    0 0 0 2px #fff4d6,
    0 8px 25px #0005,
    inset 0 0 0 2px #fff9e8;
}

.hr-follow-popup h2 {
  margin: 0;
  font-size: 60px;
  font-weight: normal;
  line-height: 1.1;
  color: #003c20;
}

.hr-follow-subtitle {
  margin: 0 0 22px;
  font-size: 28px;
  font-style: italic;
  color: #17110b;
}

.hr-follow-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 45px;
  height: 45px;
  border: 2px solid #a47b2d;
  border-radius: 50%;
  background: #fff2d4;
  color: #003c20;
  font-size: 35px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 3px 5px #0004;
}

.hr-follow-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.hr-follow-link {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 63px;
  padding: 7px 18px;
  border: 1px solid #ae8a42;
  border-radius: 15px;
  background: linear-gradient(
    120deg, #fffaf0, #f8edcf
  );
  color: #00391d;
  text-decoration: none;
  text-align: left;
  font-size: 27px;
  font-weight: bold;
  white-space: nowrap;
  transition: background .2s;
}

.hr-follow-link:hover {
  background: #f0dfb8;
}

.hr-follow-link img {
  width: 49px;
  height: 49px;
  object-fit: contain;
  flex-shrink: 0;
}

.hr-follow-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 15px 17px;
  color: #a67b2c;
  font-size: 29px;
}

.hr-follow-divider::before,
.hr-follow-divider::after {
  content: "";
  height: 1px;
  background: #a67b2c;
  flex: 1;
}

.hr-kickstarter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
  min-height: 70px;
  padding: 10px;
  border: 5px double #d6ad58;
  border-radius: 28px;
  background: linear-gradient(
    #006e37, #003e21
  );
  color: white;
  font-size: 32px;
  text-decoration: none;
  box-shadow: 0 4px 7px #0004;
}

.hr-kickstarter img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.hr-kickstarter:hover {
  background: #087b43;
}

@media (max-width: 570px) {
  .hr-follow-popup {
    padding: 20px 12px;
  }

  .hr-follow-popup h2 {
    font-size: 43px;
  }

  .hr-follow-subtitle {
    font-size: 20px;
  }

  .hr-follow-grid {
    gap: 7px;
  }

  .hr-follow-link {
    gap: 7px;
    padding: 6px;
    height: 53px;
    font-size: clamp(12px, 3.2vw, 19px);
  }

  .hr-follow-link img {
    width: 33px;
    height: 33px;
  }

  .hr-kickstarter {
    font-size: 22px;
  }
}
</style>

<section class="hr-follow-popup"
         id="hrFollowPopup"

  <button class="hr-follow-close close"
          type="button"

  </button>
