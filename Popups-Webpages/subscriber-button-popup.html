<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
}

.subscribe-popup {
  position: relative;
  width: 313px;
  height: 278px;
  padding: 15px 12px 12px 18px;
  background: linear-gradient(
    115deg,
    #fffdf7 0%,
    #fffaf1 65%,
    #f4e8d8 100%
  );
  border: 1px solid #5b4936;
  border-left: 9px solid #07512b;
  border-radius: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,.25);
  color: #000;
}

.subscribe-popup h2 {
  font-size: 40px;
  font-weight: bold;
  letter-spacing: -1.8px;
  line-height: 1.1;
  margin: 0 0 2px 4px;
}

.subscribe-popup .subtitle {
  font-size: 24px;
  font-style: italic;
  margin: 0 0 16px 6px;
  white-space: nowrap;
}

.subscribe-popup hr {
  border: 0;
  border-top: 1px solid #97794c;
  margin: 0 8px 19px 0;
}

.subscribe-popup .message {
  font-size: 21px;
  margin: 0 0 24px 5px;
  white-space: nowrap;
}

.subscribe-popup .checkout {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 275px;
  height: 49px;
  margin-left: -2px;
  border: 1px solid #064526;
  border-radius: 9px;
  background: linear-gradient(
    180deg,
    #006632 0%,
    #00451f 100%
  );
  color: #fff;
  font: 25px Georgia, serif;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}

.subscribe-popup .note {
  font-size: 15px;
  font-style: italic;
  text-align: center;
  margin: 13px -2px 0 -4px;
  white-space: nowrap;
}

.subscribe-popup .close {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 0;
  border: none;
  background: transparent;
  color: #000;
  font-family: Arial, sans-serif;
  font-size: 33px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="subscribe-popup" id="subscribePopup">

  <button class="close" type="button"
    aria-label="Close">×</button>

  <h2>Subscribe</h2>

  <p class="subtitle">Hopeful Reincarnation</p>

  <hr>

  <p class="message">Your next adventure awaits.</p>

  <a class="checkout" href="#">
    Continue to checkout
  </a>

  <p class="note">
    Review subscription details at checkout.
  </p>

</div>

</body>
</html>
